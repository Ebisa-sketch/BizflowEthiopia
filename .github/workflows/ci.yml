name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  web-test:
    name: Next.js Web App Tests & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Run Unit Tests
        run: npm run test
      - name: Build Next.js App
        run: npm run build
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/bizflow_test"
          JWT_SECRET: "ci_test_secret_key_at_least_32_characters_long"

  flutter-test:
    name: Flutter Mobile App Analyze & Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
          cache: true
      - name: Install Flutter Dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze Flutter Code
        working-directory: mobile
        run: flutter analyze
      - name: Run Flutter Tests
        working-directory: mobile
        run: flutter test
